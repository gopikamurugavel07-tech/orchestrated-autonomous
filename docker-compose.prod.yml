version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crs-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crs_production_pass_99}
      POSTGRES_DB: ${POSTGRES_DB:-crs_prod_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crs_user} -d ${POSTGRES_DB:-crs_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crs-backend-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - MOCK_MODE=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-crs_user}:${POSTGRES_PASSWORD:-crs_production_pass_99}@postgres:5432/${POSTGRES_DB:-crs_prod_db}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_prod_data:
