version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crs-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crs_password}
      POSTGRES_DB: ${POSTGRES_DB:-crs_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crs_user} -d ${POSTGRES_DB:-crs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crs-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crs-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-crs_user}:${POSTGRES_PASSWORD:-crs_password}@postgres:5432/${POSTGRES_DB:-crs_db}
      - REDIS_URL=redis://redis:6379/0
      - MOCK_MODE=${MOCK_MODE:-true}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crs-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
